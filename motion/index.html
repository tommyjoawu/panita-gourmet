<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Panita Gourmet · motion loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("fonts/fraunces-var.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("fonts/fraunces-italic-var.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("fonts/bricolage-grotesque-var.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
      }
      :root {
        --cream: #f4ebdd;
        --cocoa: #2a1a12;
        --amber: #c47a2c;
        --amber-deep: #7a4414;
        --tomato: #d8452b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        font-family: "Bricolage Grotesque", sans-serif;
        color: var(--cocoa);
      }
      .wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .fill {
        position: absolute;
        inset: 0;
      }
      .kb {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .kb img,
      .kb video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .panel {
        position: absolute;
        top: 0;
        height: 1080px;
        overflow: hidden;
      }
      .panel img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* type */
      .kicker {
        display: block;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .head {
        font-family: "Fraunces", serif;
        font-weight: 900;
        font-variation-settings: "opsz" 144;
        letter-spacing: -0.035em;
        line-height: 0.92;
      }
      .line {
        display: block;
        overflow: hidden;
        padding-bottom: 0.08em;
        margin-bottom: -0.08em;
      }
      .w {
        display: inline-block;
      }
      .dot {
        color: var(--tomato);
      }
      .rule {
        display: block;
        height: 6px;
        width: 150px;
        background: var(--amber);
        transform-origin: left center;
      }
      .textblock {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
      }

    </style>
  </head>
  <body>
    <div data-hf-id="hf-zopc" id="root" data-composition-id="main" data-start="0" data-duration="15" data-fps="30" data-width="1920" data-height="1080">
      <!-- Empanadas -->
      <div data-hf-id="hf-vra5" id="s1-host" class="clip" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="2.9" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Tequeños -->
      <div data-hf-id="hf-i110" id="s2-host" class="clip" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="2.3" data-duration="2.9" data-track-index="2" data-width="1920" data-height="1080"></div>
      <!-- Pan de jamón -->
      <div data-hf-id="hf-x9f5" id="s3-host" class="clip" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="4.6" data-duration="2.9" data-track-index="3" data-width="1920" data-height="1080"></div>
      <!-- Café -->
      <div data-hf-id="hf-fbhm" id="s4-host" class="clip" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="6.9" data-duration="2.9" data-track-index="4" data-width="1920" data-height="1080"></div>
      <!-- Hecho cada mañana -->
      <div data-hf-id="hf-nb6c" id="s5-host" class="clip" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="9.2" data-duration="3.0" data-track-index="5" data-width="1920" data-height="1080"></div>
      <!-- 4.9 estrellas -->
      <div data-hf-id="hf-8ac7" id="s6-host" class="clip" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="11.6" data-duration="3.4" data-track-index="6" data-width="1920" data-height="1080"></div>
      <!-- Panita wordmark -->
      <div data-hf-id="hf-06o5" id="s7-host" class="clip" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="13.4" data-duration="1.6" data-track-index="7" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      // Scenes live in compositions/s1..s7.html; each owns its own paused timeline.
      // t=15.0 lands on the same empty cream field as t=0, so the file loops seamlessly.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
