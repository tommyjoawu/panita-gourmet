<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-italic-var.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-var.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }

#v3-root { position: absolute; inset: 0; }
#v3-bg { background: var(--cocoa); }
#v3-img2 { opacity: 0; }
#v3-band { position: absolute; left: 0; right: 0; top: 740px; height: 520px; background: var(--cocoa); }
#v3-text { left: 86px; right: 86px; top: 740px; height: 520px; align-items: center; text-align: center; color: var(--cream); }
#v3-text .head { font-size: 168px; }
#v3-text .dot { color: #ee6a4c; }
#v3-kick { color: #e39a4f; }
      </style>
      <div id="v3-root" data-composition-id="v3" data-width="1080" data-height="1920" data-duration="2.9">
<div class="wrap" id="v3-wrap">
  <div class="fill" id="v3-bg"></div>
  <div class="kb" id="v3-kb">
    <img id="v3-img1" data-layout-allow-overflow src="assets/img/ig-pan-de-jamon-rolls.webp" alt="" />
    <img id="v3-img2" data-layout-allow-overflow src="assets/img/ig-pan-de-jamon-rolls-tray.webp" alt="" />
  </div>
  <div id="v3-band"></div>
  <div class="textblock" id="v3-text">
    <span class="kicker" id="v3-kick">Horneado aquí, receta venezolana</span>
    <h1 class="head"><span class="line"><span class="w" id="v3-h1">Pan de</span></span><span class="line"><span class="w" id="v3-h2">jamón<span class="dot">.</span></span></span></h1>
  </div>
</div>
      </div>
      <script>
        (() => {
        const tl = gsap.timeline({ paused: true });
tl.fromTo("#v3-wrap", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power4.inOut" }, 0);
tl.fromTo("#v3-kb", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power4.inOut" }, 0.2);
tl.fromTo("#v3-img1", { scale: 1.18, xPercent: 3 }, { scale: 1.04, xPercent: 0, duration: 1.5, ease: "none" }, 0);
tl.set("#v3-img2", { opacity: 0 }, 0);
tl.set("#v3-img2", { opacity: 1 }, 1.3);
tl.fromTo("#v3-img2", { scale: 1.06 }, { scale: 1.16, duration: 1.6, ease: "none" }, 1.3);
tl.fromTo(["#v3-h1", "#v3-h2"], { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out", stagger: 0.1 }, 0.35);
tl.fromTo("#v3-kick", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
        window.__timelines["v3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
