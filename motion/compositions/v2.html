<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-italic-var.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-var.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }

#v2-root { position: absolute; inset: 0; }
#v2-photo img { object-position: 50% 85%; }
#v2-vid { position: absolute; left: 0; right: 0; top: 0; height: 740px; overflow: hidden; }
#v2-vid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
#v2-band { position: absolute; left: 0; right: 0; top: 740px; height: 520px; background: var(--cocoa); }
#v2-text { left: 86px; right: 86px; top: 740px; height: 520px; align-items: center; text-align: center; color: var(--cream); }
#v2-text .head { font-size: 184px; }
#v2-text .dot { color: #ee6a4c; }
#v2-kick { color: #f0b877; }
      </style>
      <div id="v2-root" data-composition-id="v2" data-width="1080" data-height="1920" data-duration="2.9">
<div class="wrap" id="v2-wrap">
  <div class="kb" id="v2-photo"><img id="v2-img" data-layout-allow-overflow src="assets/img/ig-tequenos-minipizzas-tray.webp" alt="" /></div>
  <div id="v2-vid">
    <video id="v2-video" src="assets/video/pexels-frying-rolls-oil.mp4" data-start="0" data-duration="2.9" data-media-start="0.4" data-track-index="0" muted playsinline></video>
  </div>
  <div id="v2-band"></div>
  <div class="textblock" id="v2-text" data-layout-allow-overlap>
    <span class="kicker" id="v2-kick">También congelados para tu fiesta</span>
    <h1 class="head"><span class="line"><span class="w" id="v2-h">Tequeños<span class="dot">.</span></span></span></h1>
  </div>
</div>
      </div>
      <script>
        (() => {
        const tl = gsap.timeline({ paused: true });
tl.fromTo("#v2-wrap", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power4.inOut" }, 0);
tl.fromTo("#v2-video", { scale: 1.14 }, { scale: 1.0, duration: 2.9, ease: "none" }, 0);
tl.fromTo("#v2-img", { scale: 1.2, yPercent: 6 }, { scale: 1.04, yPercent: 0, duration: 2.9, ease: "none" }, 0);
tl.fromTo("#v2-h", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.35);
tl.fromTo("#v2-kick", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
        window.__timelines["v2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
