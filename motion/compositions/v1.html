<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-italic-var.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-var.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }

#v1-root { position: absolute; inset: 0; }
#v1-kb img { object-position: 50% 50%; }
#v1-img2 { opacity: 0; }
#v1-band { position: absolute; left: 0; right: 0; top: 740px; height: 520px; background: var(--cream); }
#v1-text { left: 86px; right: 86px; top: 740px; height: 520px; align-items: center; text-align: center; color: var(--cocoa); }
#v1-text .head { font-size: 168px; }
#v1-rule { transform-origin: center center; }
      </style>
      <div id="v1-root" data-composition-id="v1" data-width="1080" data-height="1920" data-duration="2.9">
<div class="wrap" id="v1-wrap">
  <div class="kb" id="v1-kb">
    <img id="v1-img1" data-layout-allow-overflow src="assets/img/ig-empanada-in-hand.webp" alt="" />
    <img id="v1-img2" data-layout-allow-overflow src="assets/img/ig-empanadas-stack.webp" alt="" />
  </div>
  <div id="v1-band"></div>
  <div class="textblock" id="v1-text" data-layout-allow-overlap>
    <span class="kicker" id="v1-kick">Venezolanas, recién hechas</span>
    <h1 class="head"><span class="line"><span class="w" id="v1-h">Empanadas<span class="dot">.</span></span></span></h1>
    <span class="rule" id="v1-rule"></span>
  </div>
</div>
      </div>
      <script>
        (() => {
        const tl = gsap.timeline({ paused: true });
tl.fromTo("#v1-kb", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power4.inOut" }, 0);
tl.fromTo("#v1-img1", { scale: 1.16 }, { scale: 1.02, duration: 1.5, ease: "none" }, 0);
tl.set("#v1-img2", { opacity: 0 }, 0);
tl.set("#v1-img2", { opacity: 1 }, 1.3);
tl.fromTo("#v1-img2", { scale: 1.14 }, { scale: 1.04, duration: 1.6, ease: "none" }, 1.3);
tl.fromTo("#v1-h", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.3);
tl.fromTo("#v1-kick", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
tl.fromTo("#v1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.65);
        window.__timelines["v1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
