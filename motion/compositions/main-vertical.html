<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Panita Gourmet · motion loop (vertical)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("fonts/fraunces-var.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("fonts/fraunces-italic-var.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("fonts/bricolage-grotesque-var.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
      }
      :root {
        --cream: #f4ebdd;
        --cocoa: #2a1a12;
        --amber: #c47a2c;
        --amber-deep: #7a4414;
        --tomato: #d8452b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        font-family: "Bricolage Grotesque", sans-serif;
        color: var(--cocoa);
      }
      .wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .fill {
        position: absolute;
        inset: 0;
      }
      .kb {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .kb img,
      .kb video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .panel {
        position: absolute;
        top: 0;
        height: 1920px;
        overflow: hidden;
      }
      .panel img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* type */
      .kicker {
        display: block;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.14em;
        line-height: 1.3;
        text-transform: uppercase;
      }
      .head {
        font-family: "Fraunces", serif;
        font-weight: 900;
        font-variation-settings: "opsz" 144;
        letter-spacing: -0.035em;
        line-height: 0.92;
      }
      .line {
        display: block;
        overflow: hidden;
        padding-bottom: 0.08em;
        margin-bottom: -0.08em;
      }
      .w {
        display: inline-block;
      }
      .dot {
        color: var(--tomato);
      }
      .rule {
        display: block;
        height: 6px;
        width: 150px;
        background: var(--amber);
        transform-origin: left center;
      }
      .textblock {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
      }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main-vertical" data-start="0" data-duration="15" data-fps="30" data-width="1080" data-height="1920">
      <!-- Empanadas -->
      <div id="v1-host" class="clip" data-composition-id="v1" data-composition-src="compositions/v1.html" data-start="0" data-duration="2.9" data-track-index="1" data-width="1080" data-height="1920"></div>
      <!-- Tequeños -->
      <div id="v2-host" class="clip" data-composition-id="v2" data-composition-src="compositions/v2.html" data-start="2.3" data-duration="2.9" data-track-index="2" data-width="1080" data-height="1920"></div>
      <!-- Pan de jamón -->
      <div id="v3-host" class="clip" data-composition-id="v3" data-composition-src="compositions/v3.html" data-start="4.6" data-duration="2.9" data-track-index="3" data-width="1080" data-height="1920"></div>
      <!-- Café -->
      <div id="v4-host" class="clip" data-composition-id="v4" data-composition-src="compositions/v4.html" data-start="6.9" data-duration="2.9" data-track-index="4" data-width="1080" data-height="1920"></div>
      <!-- Hecho cada mañana -->
      <div id="v5-host" class="clip" data-composition-id="v5" data-composition-src="compositions/v5.html" data-start="9.2" data-duration="3.0" data-track-index="5" data-width="1080" data-height="1920"></div>
      <!-- 4.9 estrellas -->
      <div id="v6-host" class="clip" data-composition-id="v6" data-composition-src="compositions/v6.html" data-start="11.6" data-duration="3.4" data-track-index="6" data-width="1080" data-height="1920"></div>
      <!-- Panita wordmark -->
      <div id="v7-host" class="clip" data-composition-id="v7" data-composition-src="compositions/v7.html" data-start="13.4" data-duration="1.6" data-track-index="7" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      // Scenes live in compositions/v1..v7.html (vertical 1080x1920 cut; text safe zone x 8-92%, y 10-66%); each owns its own paused timeline.
      // t=15.0 lands on the same empty cream field as t=0, so the file loops seamlessly.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main-vertical"] = tl;
    </script>
  </body>
</html>
