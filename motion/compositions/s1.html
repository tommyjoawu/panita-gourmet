<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-italic-var.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-var.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }

#s1-root { position: absolute; inset: 0; }
#s1-panel { left: 0; width: 800px; }
#s1-text { left: 890px; width: 860px; top: 0; bottom: 260px; }
#s1-text .head { font-size: 150px; color: var(--cocoa); }
#s1-kick { color: var(--cocoa); }
#s1-img2 { opacity: 0; }
      </style>
      <div id="s1-root" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="2.9">
<div class="wrap" id="s1-wrap">
  <div class="panel" id="s1-panel">
    <img id="s1-img1" data-layout-allow-overflow src="assets/img/ig-empanada-in-hand.webp" alt="" />
    <img id="s1-img2" data-layout-allow-overflow src="assets/img/ig-empanadas-stack.webp" alt="" />
  </div>
  <div class="textblock" id="s1-text" data-layout-allow-overlap>
    <span class="kicker" id="s1-kick">Venezolanas, recién hechas</span>
    <h1 class="head"><span class="line"><span class="w" id="s1-h">Empanadas<span class="dot">.</span></span></span></h1>
    <span class="rule" id="s1-rule"></span>
  </div>
</div>
      </div>
      <script>
        (() => {
        const tl = gsap.timeline({ paused: true });
tl.fromTo("#s1-panel", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power4.inOut" }, 0);
tl.fromTo("#s1-img1", { scale: 1.16 }, { scale: 1.02, duration: 1.5, ease: "none" }, 0);
tl.set("#s1-img2", { opacity: 0 }, 0);
tl.set("#s1-img2", { opacity: 1 }, 1.3);
tl.fromTo("#s1-img2", { scale: 1.14 }, { scale: 1.04, duration: 1.6, ease: "none" }, 1.3);
tl.fromTo("#s1-h", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.3);
tl.fromTo("#s1-kick", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.5);
tl.fromTo("#s1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.65);
        window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
