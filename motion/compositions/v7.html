<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-italic-var.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-var.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }

#v7-root { position: absolute; inset: 0; }
#v7-text { left: 86px; right: 86px; top: 192px; height: 1075px; align-items: center; text-align: center; gap: 28px; }
#v7-mark { font-family: "Fraunces", serif; font-style: italic; font-weight: 900; font-variation-settings: "opsz" 144; font-size: 240px; line-height: 0.95; letter-spacing: -0.04em; color: var(--tomato); }
#v7-sub { color: var(--cocoa); font-size: 38px; letter-spacing: 0.3em; }
#v7-place { font-family: "Fraunces", serif; font-weight: 600; font-size: 58px; line-height: 1.15; color: var(--cocoa); }
#v7-rule { width: 130px; background: var(--amber); transform-origin: center center; }
      </style>
      <div id="v7-root" data-composition-id="v7" data-width="1080" data-height="1920" data-duration="1.6">
<div class="wrap" id="v7-wrap">
  <div class="textblock" id="v7-text">
    <span class="line"><span class="w" id="v7-mark">Panita</span></span>
    <span class="kicker" id="v7-sub">Gourmet &amp; Bakery</span>
    <span class="rule" id="v7-rule"></span>
    <span id="v7-place">San Francisco<br />Ciudad de Panamá</span>
  </div>
</div>
      </div>
      <script>
        (() => {
        const tl = gsap.timeline({ paused: true });
tl.fromTo("#v7-mark", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.3);
tl.fromTo("#v7-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.45);
tl.fromTo("#v7-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.55);
tl.fromTo("#v7-place", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
tl.to("#v7-text", { y: -50, opacity: 0, duration: 0.35, ease: "power2.in" }, 1.1);
        window.__timelines["v7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
