<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-italic-var.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-var.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }

#s2-root { position: absolute; inset: 0; }
#s2-text .dot { color: #ee6a4c; }
#s2-scrim { background: radial-gradient(ellipse 1500px 1100px at 26% 40%, rgba(22,12,7,0.9) 0%, rgba(22,12,7,0.78) 50%, rgba(22,12,7,0.4) 100%); }
#s2-card { left: 1200px; top: 150px; width: 470px; height: 780px; border: 10px solid var(--cream); box-shadow: 0 30px 80px rgba(20,10,5,0.55); }
#s2-text { left: 240px; width: 900px; top: 0; bottom: 260px; color: var(--cream); }
#s2-text .head { font-size: 176px; }
#s2-kick { color: #f0b877; }
      </style>
      <div id="s2-root" data-composition-id="s2" data-width="1920" data-height="1080" data-duration="2.9">
<div class="wrap" id="s2-wrap">
  <div class="kb" id="s2-kb">
    <video id="s2-video" src="assets/video/pexels-frying-rolls-oil.mp4" data-start="0" data-duration="2.9" data-media-start="0.4" data-track-index="0" muted playsinline></video>
  </div>
  <div class="fill" id="s2-scrim"></div>
  <div class="panel" id="s2-card"><img id="s2-img" data-layout-allow-overflow src="assets/img/ig-tequenos-minipizzas-tray.webp" alt="" /></div>
  <div class="textblock" id="s2-text" data-layout-allow-overlap>
    <span class="kicker" id="s2-kick">También congelados para tu fiesta</span>
    <h1 class="head"><span class="line"><span class="w" id="s2-h">Tequeños<span class="dot">.</span></span></span></h1>
  </div>
</div>
      </div>
      <script>
        (() => {
        const tl = gsap.timeline({ paused: true });
tl.fromTo("#s2-wrap", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power4.inOut" }, 0);
tl.fromTo("#s2-kb", { scale: 1.14 }, { scale: 1.0, duration: 2.9, ease: "none" }, 0);
tl.fromTo("#s2-card", { yPercent: 18, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.7, ease: "back.out(1.3)" }, 0.45);
tl.fromTo("#s2-img", { scale: 1.2 }, { scale: 1.02, duration: 2.4, ease: "none" }, 0.45);
tl.fromTo("#s2-h", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.35);
tl.fromTo("#s2-kick", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
        window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
