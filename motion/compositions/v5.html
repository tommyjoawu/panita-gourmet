<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("fonts/fraunces-italic-var.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-var.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }

#v5-root { position: absolute; inset: 0; }
#v5-scrim { background: radial-gradient(ellipse 900px 700px at 50% 52%, rgba(26,14,8,0.85) 0%, rgba(26,14,8,0.6) 60%, rgba(26,14,8,0.35) 100%); }
#v5-text { left: 86px; right: 86px; top: 740px; height: 520px; align-items: center; text-align: center; color: var(--cream); }
#v5-text .head { font-size: 164px; }
#v5-h2 { font-style: italic; font-weight: 800; }
#v5-kick { color: #f0b877; }
#v5-under { display: block; width: 520px; height: 8px; background: var(--tomato); transform-origin: center center; }
      </style>
      <div id="v5-root" data-composition-id="v5" data-width="1080" data-height="1920" data-duration="3.0">
<div class="wrap" id="v5-wrap">
  <div class="kb" id="v5-kb">
    <video id="v5-oven" src="assets/video/pexels-bread-oven.mp4" data-start="0" data-duration="1.4" data-media-start="2" data-track-index="0" muted playsinline></video>
    <video id="v5-rolls" src="assets/video/pexels-sweet-rolls-closeup.mp4" data-start="1.4" data-duration="1.6" data-media-start="3" data-track-index="1" muted playsinline></video>
  </div>
  <div class="fill" id="v5-scrim"></div>
  <div class="textblock" id="v5-text">
    <span class="kicker" id="v5-kick">Panadería y cocina de la casa</span>
    <h1 class="head"><span class="line"><span class="w" id="v5-h1">Hecho cada</span></span><span class="line"><span class="w" id="v5-h2">mañana</span></span></h1>
    <span id="v5-under"></span>
  </div>
</div>
      </div>
      <script>
        (() => {
        const tl = gsap.timeline({ paused: true });
tl.fromTo("#v5-wrap", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power4.inOut" }, 0);
tl.fromTo("#v5-kb", { scale: 1.12 }, { scale: 1.0, duration: 3.0, ease: "none" }, 0);
tl.fromTo(["#v5-h1", "#v5-h2"], { yPercent: 105 }, { yPercent: 0, duration: 0.75, ease: "expo.out", stagger: 0.12 }, 0.35);
tl.fromTo("#v5-kick", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
tl.fromTo("#v5-under", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.85);
        window.__timelines["v5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
